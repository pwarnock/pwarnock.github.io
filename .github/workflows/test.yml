name: Test Hugo build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Trust mise config
        run: mise trust

      - name: Run placeholder detection
        run: ./scripts/placeholder-detection.sh

      - name: Test Hugo build
        run: hugo --source packages/site --minify --gc

      - name: Check for broken internal links
        run: |
          HTML_COUNT=$(find packages/site/public -name "*.html" 2>/dev/null | wc -l)
          if [ "$HTML_COUNT" -eq 0 ]; then
            echo "::error::No HTML files found in packages/site/public — Hugo build may have failed"
            exit 1
          fi
          echo "Found $HTML_COUNT HTML files, checking internal links..."
          # Check if all internal links resolve to existing files
          find packages/site/public -name "*.html" -exec grep -H "href=\"/" {} \; | \
          while read -r line; do
            url=$(echo "$line" | sed -n 's/.*href="\/\([^"]*\)".*/\1/p')
            if [ -n "$url" ]; then
              if [ ! -f "packages/site/public/$url" ] && [ ! -f "packages/site/public/$url/index.html" ]; then
                echo "Broken link found: /$url"
                exit 1
              fi
            fi
          done
          echo "All internal links are valid"
